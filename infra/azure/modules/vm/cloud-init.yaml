#cloud-config
package_update: true
packages:
  - docker.io
  - nginx
  - curl
  - ca-certificates
  - gnupg
  - lsb-release
write_files:
  - path: /etc/nginx/sites-available/launchpad
    permissions: '0644'
    content: |
      server {
          listen 80 default_server;
          server_name _;
          location / {
              proxy_pass http://127.0.0.1:8000;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
          }
      }
runcmd:
  - |
    set -eu
    install -m 0755 -d /etc/apt/keyrings
    curl -fsSL https://packages.microsoft.com/keys/microsoft.asc -o /tmp/microsoft.asc
    gpg --dearmor --yes -o /etc/apt/keyrings/microsoft.gpg /tmp/microsoft.asc
    chmod a+r /etc/apt/keyrings/microsoft.gpg
    echo 'deb [arch=amd64 signed-by=/etc/apt/keyrings/microsoft.gpg] https://packages.microsoft.com/repos/azure-cli/ jammy main' > /etc/apt/sources.list.d/azure-cli.list
    apt-get update
    apt-get install -y azure-cli
    rm /tmp/microsoft.asc
  - systemctl enable --now docker
  - rm -f /etc/nginx/sites-enabled/default
  - ln -s /etc/nginx/sites-available/launchpad /etc/nginx/sites-enabled/launchpad
  - nginx -t
  - systemctl enable nginx
  - systemctl restart nginx
