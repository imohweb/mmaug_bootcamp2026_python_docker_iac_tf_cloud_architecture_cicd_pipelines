services:
  support-agent:
    build: .
    image: mmaug-support-agent:1.0
    ports:
      - "127.0.0.1:8090:8000"
    environment:
      AI_MODE: "off"
      # Export SPECIALIST_API_TOKEN in your shell first; never hard-code it here.
      SPECIALIST_API_TOKEN: ${SPECIALIST_API_TOKEN:-}
    volumes:
      - support-data:/data

volumes:
  support-data:
