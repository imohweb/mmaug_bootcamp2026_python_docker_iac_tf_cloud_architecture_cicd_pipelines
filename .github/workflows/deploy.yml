# GITHUB SETUP - Settings > Environments > dev:
# Required VARIABLES: AZURE_CLIENT_ID (existing SP application/client ID),
# AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID,
# AZURE_RESOURCE_GROUP=RG-MMAUG-Bootcamp, ACR_NAME (not registry hostname),
# BACKEND_WEB_APP_NAME, FRONTEND_WEB_APP_NAME (Terraform outputs).
# Required SECRET: SPECIALIST_API_TOKEN (random, 32+ chars, not a placeholder).
# OIDC supplies credentials; do NOT create an AZURE_CLIENT_SECRET.
# Generated by this workflow, NOT user configuration: BACKEND_IMAGE_REF,
# FRONTEND_IMAGE_REF, GITHUB_SHA, GITHUB_RUN_ID, GITHUB_RUN_ATTEMPT.
# Configure dev required reviewers and main restrictions before live deployment.
# Prepare infrastructure/state separately through infra.yml.
name: Deploy support agent to Azure App Service

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: azure-demo-release
  cancel-in-progress: false

jobs:
  test:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: support-agent/frontend/package-lock.json
      - name: Backend tests
        working-directory: support-agent/backend
        run: |
          pip install -r requirements.txt
          python -m unittest -v
      - name: Frontend tests
        working-directory: support-agent/frontend
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run build
          node --test server.test.mjs

  release:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: dev
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      ACR_NAME: ${{ vars.ACR_NAME }}
      BACKEND_WEB_APP_NAME: ${{ vars.BACKEND_WEB_APP_NAME }}
      FRONTEND_WEB_APP_NAME: ${{ vars.FRONTEND_WEB_APP_NAME }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Sign in without a client secret
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Build once, push once, resolve immutable image
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ACR_NAME" =~ ^[a-zA-Z0-9]{5,50}$ ]] || { echo "Invalid ACR_NAME" >&2; exit 1; }
          registry=$(az acr show --name "$ACR_NAME" --query loginServer --output tsv)
          [[ "$registry" =~ ^[a-zA-Z0-9]+\.azurecr\.io$ ]] || { echo "Invalid registry hostname" >&2; exit 1; }
          tag="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          az acr login --name "$ACR_NAME" --output none
          for target in backend frontend; do
            repository="support-agent-$target"
            docker build --platform linux/amd64 --target "$target" -t "$registry/$repository:$tag" support-agent
            docker push "$registry/$repository:$tag"
            digest=$(az acr repository show --name "$ACR_NAME" --image "$repository:$tag" --query digest --output tsv)
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "Invalid image digest" >&2; exit 1; }
            if [[ "$target" == backend ]]; then variable=BACKEND_IMAGE_REF; else variable=FRONTEND_IMAGE_REF; fi
            echo "$variable=$registry/$repository@$digest" >> "$GITHUB_ENV"
            echo "Release $target image: $registry/$repository@$digest" >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Deploy both digests to App Service and verify
        env:
          SPECIALIST_API_TOKEN: ${{ secrets.SPECIALIST_API_TOKEN }}
        run: bash scripts/deploy-azure.sh
