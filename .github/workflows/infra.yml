# GITHUB SETUP - environment: dev (existing OIDC trust).
# Required environment VARIABLES (Settings > Environments > dev):
# AZURE_CLIENT_ID: app/client ID of mmaug_bootcamp_spn_2026.
# AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID: target tenant/subscription.
# AZURE_RESOURCE_GROUP: RG-MMAUG-Bootcamp (existing; never created/deleted).
# STATE_ACCOUNT: globally unique 3-24 lowercase/digit storage account name.
# RESOURCE_PREFIX: unique 6-18 lowercase/digit prefix starting with a letter.
# Optional environment VARIABLE: FOUNDRY_LOCATION (default eastus2; verify quota).
# No client secret required; GitHub supplies OIDC tokens automatically.
# ADMIN PREREQUISITES: scoped resource/RBAC management and Blob data access.
# Configure dev required reviewers and main-only branch restrictions BEFORE apply.
# Migrate/reconcile earlier local state before confirming state_ready.
# State key: mmaug/azure-demo.tfstate; bootstrap containers: tfstate, knowledge, tickets.
# Apply consumes the saved plan from THIS run, never an arbitrary artifact.
name: Azure infrastructure
on:
  workflow_dispatch:
    inputs:
      apply:
        description: Apply the saved plan after environment review (paid operation)
        type: boolean
        default: false
      state_ready:
        description: Existing state has been reconciled/migrated or this is a reviewed new deployment
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: azure-infrastructure-dev
  cancel-in-progress: false
env:
  ARM_USE_OIDC: 'true'
  ARM_USE_AZUREAD: 'true'
  TF_IN_AUTOMATION: 'true'
jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      STATE_ACCOUNT: ${{ vars.STATE_ACCOUNT }}
      STATE_RG: ${{ vars.AZURE_RESOURCE_GROUP }}
      TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_resource_group_name: ${{ vars.AZURE_RESOURCE_GROUP }}
      TF_VAR_prefix: ${{ vars.RESOURCE_PREFIX }}
      TF_VAR_storage_account_name: ${{ vars.STATE_ACCOUNT }}
      TF_VAR_foundry_location: ${{ vars.FOUNDRY_LOCATION || 'eastus2' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check explicit state review and required configuration
        env:
          STATE_READY: ${{ inputs.state_ready }}
        run: |
          set -euo pipefail
          [[ "$STATE_READY" == true ]] || { echo "Review/migrate earlier state before initializing this backend"; exit 1; }
          : "${ARM_CLIENT_ID:?}" "${ARM_TENANT_ID:?}" "${ARM_SUBSCRIPTION_ID:?}"
          : "${STATE_ACCOUNT:?}" "${TF_VAR_prefix:?}"
          [[ "$STATE_RG" == RG-MMAUG-Bootcamp ]] || exit 1
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.16.5'
      - run: pip install -r support-agent/backend/requirements.txt
      - name: Bootstrap private storage before Terraform init
        run: bash scripts/bootstrap-state.sh
      - name: Initialize and save plan
        working-directory: infra/azure
        run: |
          set -euo pipefail
          printf 'terraform { backend "azurerm" {} }\n' > backend.tf
          terraform init -input=false \
            -backend-config="storage_account_name=$STATE_ACCOUNT" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=mmaug/azure-demo.tfstate" \
            -backend-config="use_azuread_auth=true" \
            -backend-config="use_oidc=true"
          terraform fmt -check -recursive
          terraform validate
          terraform plan -input=false -lock-timeout=5m -out=azure.tfplan
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reviewed-infrastructure-plan
          path: infra/azure/azure.tfplan
          retention-days: 1
          if-no-files-found: error
  apply:
    needs: plan
    if: inputs.apply && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      STATE_ACCOUNT: ${{ vars.STATE_ACCOUNT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require configured reviewers before apply
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api "repos/$REPOSITORY/environments/dev" \
            --jq '[.protection_rules[] | select(.type == "required_reviewers") | .reviewers[]] | length > 0' |
            grep -qx true
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.16.5'
      - run: pip install -r support-agent/backend/requirements.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: reviewed-infrastructure-plan
          path: infra/azure
      - name: Apply exact saved plan including verified IQ setup before agent registration
        working-directory: infra/azure
        run: |
          set -euo pipefail
          printf 'terraform { backend "azurerm" {} }\n' > backend.tf
          terraform init -input=false \
            -backend-config="storage_account_name=$STATE_ACCOUNT" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=mmaug/azure-demo.tfstate" \
            -backend-config="use_azuread_auth=true" \
            -backend-config="use_oidc=true"
          terraform apply -input=false -lock-timeout=5m azure.tfplan
          terraform output backend_web_app_name
          terraform output frontend_web_app_name
          terraform output acr_name
